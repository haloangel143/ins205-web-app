<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f13;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: linear-gradient(145deg, #1a1a24, #12121a);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 30px 80px rgba(120, 80, 255, 0.15);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c5cfc, #a78bfa);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            font-weight: 300;
            color: #fff;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            box-shadow: 0 8px 30px rgba(124, 92, 252, 0.25);
        }

        .card:hover .avatar {
            transform: scale(1.08) rotate(-4deg);
            box-shadow: 0 12px 45px rgba(124, 92, 252, 0.45);
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        .card:hover .name {
            color: #a78bfa;
        }

        .title {
            font-size: 15px;
            color: #8b8ba3;
            font-weight: 400;
            letter-spacing: 0.3px;
            margin-bottom: 20px;
        }

        .bio {
            font-size: 15px;
            color: #b8b8cc;
            line-height: 1.7;
            margin-bottom: 28px;
            padding: 0 4px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: block;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.2px;
        }

        .btn:hover {
            background: #7c5cfc;
            border-color: #7c5cfc;
            transform: translateX(6px) scale(1.02);
            box-shadow: 0 8px 30px rgba(124, 92, 252, 0.35);
        }

        .btn-github:hover {
            background: #333;
            border-color: #555;
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.08);
        }

        .btn-docker:hover {
            background: #2496ed;
            border-color: #2496ed;
            box-shadow: 0 8px 30px rgba(36, 150, 237, 0.35);
        }

        .badge {
            display: inline-block;
            margin-top: 24px;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            color: #8b8ba3;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .card:hover .badge {
            color: #a78bfa;
            border-color: rgba(124, 92, 252, 0.25);
            background: rgba(124, 92, 252, 0.06);
            transform: scale(1.04);
        }

        .badge i {
            font-style: normal;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">✦</div>
        <div class="name">Anyagu chisom</div>
        <div class="title">Creative Developer</div>
        <div class="bio">
            Building clean, thoughtful interfaces with a touch of personality.
            Currently exploring the intersection of design and code.
        </div>
        <div class="links">
            <a href="#" class="btn">View Projects →</a>
            <a href="#" class="btn btn-github">GitHub</a>
            <a href="#" class="btn btn-docker">Docker Hub</a>
        </div>
        <div class="badge">
            <i>✦</i> hover is the signature
        </div>
    </div>
</body>
</html>
